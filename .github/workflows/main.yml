name: Windows - LiteManager

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Downloading & Installing Essentials
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Invoke-WebRequest `
            -Uri "https://gitlab.com/chamod12/lm_win-10_github_rdp/-/raw/main/Downloads.bat" `
            -OutFile "$env:GITHUB_WORKSPACE\Downloads.bat"

          Write-Host "Running Downloads.bat..."
          cmd /c "$env:GITHUB_WORKSPACE\Downloads.bat"

          Write-Host "Installation finished."


      - name: Find LiteManager Server
        shell: powershell
        run: |
          Write-Host "Searching for ROMServer.exe..."

          $server = Get-ChildItem `
            -Path "C:\Program Files","C:\Program Files (x86)","$env:GITHUB_WORKSPACE" `
            -Filter "ROMServer.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $server) {
            Write-Host "ERROR: ROMServer.exe was not found."
            exit 1
          }

          Write-Host "LiteManager Server:"
          Write-Host $server

          "LM_SERVER=$server" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8


      - name: Start LiteManager
        shell: powershell
        run: |
          Write-Host "Starting LiteManager..."

          Start-Process `
            -FilePath "$env:LM_SERVER" `
            -WorkingDirectory (Split-Path "$env:LM_SERVER")

          Start-Sleep -Seconds 15

          $process = Get-Process ROMServer -ErrorAction SilentlyContinue

          if (-not $process) {
            Write-Host "ERROR: ROMServer is not running."
            exit 1
          }

          Write-Host "ROMServer is running."
          Write-Host "PID: $($process.Id)"


      - name: Configure LiteManager ID
        shell: powershell
        run: |
          $serverDir = Split-Path "$env:LM_SERVER"

          Write-Host "LiteManager directory:"
          Write-Host $serverDir

          # Generate a unique ID for this GitHub runner
          $id = $env:COMPUTERNAME

          Write-Host "Configuring LiteManager ID:"
          Write-Host $id

          Set-Content `
            -Path "$serverDir\ID.txt" `
            -Value $id `
            -Encoding ASCII

          "LM_ID=$id" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          Write-Host "LiteManager ID configured."


      - name: Restart LiteManager
        shell: powershell
        run: |
          Write-Host "Restarting LiteManager..."

          Get-Process ROMServer -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          Start-Process `
            -FilePath "$env:LM_SERVER" `
            -WorkingDirectory (Split-Path "$env:LM_SERVER")

          Start-Sleep -Seconds 15

          $process = Get-Process ROMServer -ErrorAction SilentlyContinue

          if (-not $process) {
            Write-Host "ERROR: ROMServer failed to restart."
            exit 1
          }

          Write-Host "ROMServer restarted successfully."
          Write-Host "PID: $($process.Id)"


      - name: Diagnose LiteManager
        shell: powershell
        run: |
          Write-Host "=== ROMServer Process ==="

          Get-Process ROMServer -ErrorAction SilentlyContinue |
            Select-Object Id, ProcessName, Path

          Write-Host ""
          Write-Host "=== LiteManager Services ==="

          Get-Service |
            Where-Object {
              $_.Name -match "ROM|Lite" -or
              $_.DisplayName -match "LiteManager"
            } |
            Select-Object Status, Name, DisplayName

          Write-Host ""
          Write-Host "=== Network Connections ==="

          $proc = Get-Process ROMServer -ErrorAction SilentlyContinue

          if ($proc) {
            Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
              Where-Object {
                $_.OwningProcess -in $proc.Id
              } |
              Select-Object LocalAddress, LocalPort, State, OwningProcess
          }
          else {
            Write-Host "ROMServer process NOT FOUND"
          }

          Write-Host ""
          Write-Host "=== Internet Test ==="

          Test-NetConnection 8.8.8.8 -Port 53

          Write-Host ""
          Write-Host "=== HTTPS Test ==="

          try {
            $r = Invoke-WebRequest `
              -Uri "https://www.google.com" `
              -UseBasicParsing `
              -TimeoutSec 15

            Write-Host "HTTPS connection: OK"
            Write-Host "HTTP Status: $($r.StatusCode)"
          }
          catch {
            Write-Host "HTTPS connection FAILED"
            Write-Host $_.Exception.Message
          }


      - name: Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       LITEMANAGER CONNECTION INFO"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Windows User   : runneradmin"
          Write-Host "LiteManager ID : $env:LM_ID"
          Write-Host "Server         : $env:LM_SERVER"
          Write-Host ""
          Write-Host "=========================================="


      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "LiteManager is running."
          Write-Host "LiteManager ID: $env:LM_ID"

          while ($true) {

            $process = Get-Process ROMServer -ErrorAction SilentlyContinue

            if ($process) {
              Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') - ROMServer RUNNING - PID $($process.Id)"
            }
            else {
              Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') - ROMServer STOPPED"
              exit 1
            }

            Start-Sleep -Seconds 60
          }
