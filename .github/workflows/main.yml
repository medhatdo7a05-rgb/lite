      - name: Diagnose LiteManager
        shell: powershell
        run: |
          Write-Host "=== ROMServer Process ==="
          Get-Process ROMServer -ErrorAction SilentlyContinue |
            Select-Object Id, ProcessName, Path

          Write-Host ""
          Write-Host "=== LiteManager Services ==="
          Get-Service |
            Where-Object {
              $_.Name -match "ROM|Lite" -or
              $_.DisplayName -match "LiteManager"
            } |
            Select-Object Status, Name, DisplayName

          Write-Host ""
          Write-Host "=== Network Connections ==="

          $proc = Get-Process ROMServer -ErrorAction SilentlyContinue

          if ($proc) {
            Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
              Where-Object {
                $_.OwningProcess -in $proc.Id
              } |
              Select-Object LocalAddress, LocalPort, State, OwningProcess
          }
          else {
            Write-Host "ROMServer process NOT FOUND"
          }

          Write-Host ""
          Write-Host "=== Internet Test ==="

          Test-NetConnection 8.8.8.8 -Port 53

          Write-Host ""
          Write-Host "=== HTTPS Test ==="

          try {
            $r = Invoke-WebRequest `
              -Uri "https://www.google.com" `
              -UseBasicParsing `
              -TimeoutSec 15

            Write-Host "HTTPS connection: OK"
            Write-Host "HTTP Status: $($r.StatusCode)"
          }
          catch {
            Write-Host "HTTPS connection FAILED"
            Write-Host $_.Exception.Message
          }


      - name: Restart LiteManager Server
        shell: powershell
        run: |
          $server = "$env:LM_SERVER"

          if (-not (Test-Path $server)) {
            Write-Host "ERROR: ROMServer.exe not found:"
            Write-Host $server
            exit 1
          }

          Write-Host "Stopping existing ROMServer..."

          Get-Process ROMServer -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          Write-Host "Starting LiteManager Server..."

          Start-Process `
            -FilePath $server `
            -WorkingDirectory (Split-Path $server)

          Start-Sleep -Seconds 15

          $process = Get-Process ROMServer -ErrorAction SilentlyContinue

          if ($process) {
            Write-Host "=========================================="
            Write-Host "ROMServer is RUNNING"
            Write-Host "PID: $($process.Id)"
            Write-Host "=========================================="
          }
          else {
            Write-Host "ERROR: ROMServer failed to start."
            exit 1
          }


      - name: Verify LiteManager
        shell: powershell
        run: |
          Write-Host "Waiting for LiteManager initialization..."

          Start-Sleep -Seconds 15

          $process = Get-Process ROMServer -ErrorAction SilentlyContinue

          if (-not $process) {
            Write-Host "ERROR: ROMServer is not running."
            exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " LITEMANAGER STATUS"
          Write-Host "=========================================="
          Write-Host "Process : RUNNING"
          Write-Host "PID     : $($process.Id)"
          Write-Host "ID      : $env:LM_ID"
          Write-Host "Server  : $env:LM_SERVER"
          Write-Host "=========================================="
          Write-Host ""


      - name: Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       LITEMANAGER CONNECTION INFO"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Windows User    : runneradmin"
          Write-Host "LiteManager ID  : $env:LM_ID"
          Write-Host "LiteManager     : RUNNING"
          Write-Host ""
          Write-Host "=========================================="


      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "Keeping runner alive..."
          Write-Host "LiteManager ID: $env:LM_ID"

          while ($true) {

            $process = Get-Process ROMServer -ErrorAction SilentlyContinue

            if ($process) {
              Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') - ROMServer RUNNING - PID $($process.Id)"
            }
            else {
              Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') - ROMServer STOPPED"
              exit 1
            }

            Start-Sleep -Seconds 60
          }
